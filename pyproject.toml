[project]
name = "auto-warehouse-robot-fleet-optimizer"
version = "0.0.1"
description = "A system that coordinates multiple warehouse robots to pick items and deliver them, while learning optimal routing and task assignment over time."
authors = [{ name = 'Cafesuada', email = 'connghiencafe@protonmail.com' }]
maintainers = [{ name = 'Cafesuada', email = 'connghiencafe@protonmail.com' }]
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.uv.workspace]
members = ["shared/common/commonlib-python"]

[tool.ruff.lint.per-file-ignores]
# "**/{tests,docs,tools}/*" = ["E402"]
"**/tests/*" = ["S101"]

[tool.ruff.format]
# 5. Use single quotes in `ruff format`.
quote-style = "single"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 72

[tool.ruff.lint]
# select = [
#     "ALL",
# ]
select = [
    "F",   # pyflakes (runtime errors, unused imports/variables)
    "E",
    "W",   # pycodestyle (style and whitespace)
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade (modernize syntax)
    "B",   # flake8-bugbear (common bugs & best practices)
    "SIM", # flake8-simplify (code simplification)
    "C4",  # flake8-comprehensions (list/set/dict comprehension help)
    "TC",  # flake8-type-checking (move typing imports to `if TYPE_CHECKING`)
    "PL",  # flake8-unused-arguments
    "RET", # flake8-return (return statement issues)
    "ARG", # pylint rules (a subset)
    "ANN", # type annotations enforcement
    "COM", # flake8-commas
    "C90", # maccabe complexity
    "D",   # pydocstyle
    "A",   # flake8-builtins

    # "YTT",
    # "DTZ",
    # "ISC",
    # "ICN",
    # "INP",
    # "PIE",
    # "PT",
    # "TID",
    # "PLC",
    # "PLE",
    # "PLR",
    # "PLW",
    # "RUF",
    # "PYI",
]

ignore = [
    'Q000',   # Double quote
    'ERA001', # Code comment
    'E501',   # line too long
    'F841',   # pyright already supports this
    'F401',
    'D416',   # numpydocstyle does not use colon in section name
]

fixable = ['ALL']
unfixable = []

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"
