syntax = "proto3";

package envelopes.event_envelope.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.roboops.envelopes.event_envelope.v1";

// Generic metadata wrapper attached to every event message.
// The event payload is defined in event-specific protos.
message EventEnvelope {
  // Unique ID for this event instance (UUID recommended).
  string event_id = 1;

  // Stable name + version, e.g. "waypoint.saved.v1".
  string event_type = 2;

  // When the event happened (UTC).
  google.protobuf.Timestamp occurred_at = 3;

  // Service that produced it, e.g. "map-service".
  string producer = 4;

  // Optional: tenant/org context (useful for multi-tenancy).
  string tenant_id = 5;

  // Optional: logical partition key (map_id, robot_id, mission_id).
  // For Kafka later, use this as the Kafka message key.
  string partition_key = 6;

  // Idempotency key for consumers (helps dedupe at-least-once delivery).
  // Often equals event_id, but can be different if you emit retries.
  string idempotency_key = 7;

  // Correlation & causation for debugging workflows/sagas.
  // correlation_id: ties a chain of operations together (request/mission).
  // causation_id: the direct trigger (command_id, prior event_id).
  string correlation_id = 8;
  string causation_id = 9;

  // Distributed tracing propagation.
  // W3C trace context header "traceparent" (recommended).
  string traceparent = 10;

  // Optional span link(s) or vendor-specific extras.
  // Keep this small; use it sparingly.
  map<string, string> attributes = 11;

  // Schema/content metadata (useful for mixed encodings or future migration).
  // Example: "application/x-protobuf", "application/json".
  string content_type = 12;

  // Increment if you ever change envelope semantics (rare).
  uint32 envelope_version = 13;
}
